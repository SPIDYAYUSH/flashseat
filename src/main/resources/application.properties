spring.application.name=flashseat

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/flashseat
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=host.docker.internal
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=host.docker.internal:9092
spring.kafka.consumer.group-id=flashseat-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always